name: Bin2Chars CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # GCC
          - os: ubuntu-latest
            compiler: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - os: ubuntu-latest
            compiler: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug

          # Clang
          - os: ubuntu-latest
            compiler: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - os: ubuntu-latest
            compiler: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

          # MSVC
          - os: windows-latest
            compiler: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Boost.Test - Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev

      - name: Install Boost.Test - Windows
        if: runner.os == 'Windows'
        run: |
          vcpkg install boost-test:x64-windows

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: >
          cmake
          --build build
          --config ${{ matrix.build_type }}
          --parallel

      - name: Test
        run: >
          ctest
          --test-dir build
          --build-config ${{ matrix.build_type }}
          --output-on-failure
